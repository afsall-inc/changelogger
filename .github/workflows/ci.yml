name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      toolchain:
        default: "nightly-2026-02-18"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-18
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Validate PRDoc
        if: github.event_name == 'pull_request'
        env:
          CI: "true"
        run: |
          PRDOC="prdoc/pr_${{ github.event.pull_request.number }}.prdoc"
          if [ -f "$PRDOC" ]; then
            cargo run --package changelogger-cli -- prdoc validate "$PRDOC"
          else
            echo "No prdoc found at $PRDOC (skipping validation)"
          fi
      - name: Build
        run: cargo build --workspace