name: PRDoc

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: nightly-2026-02-18

    - uses: Swatinem/rust-cache@v2

    - name: Build CLI
      run: cargo build --package changelogger-cli

    - name: Generate PRDoc
      id: generate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PR_NUM=${{ github.event.pull_request.number }}
        PRDOC="prdoc/pr_${PR_NUM}.prdoc"
        if [ -f "$PRDOC" ]; then
          echo "PRDoc already exists at $PRDOC — validating only"
          echo "generated=false" >> "$GITHUB_OUTPUT"
        else
          cargo run --package changelogger-cli -- prdoc generate --pr "$PR_NUM" --force
          echo "generated=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate PRDoc
      env:
        CI: "true"
      run: |
        PRDOC="prdoc/pr_${{ github.event.pull_request.number }}.prdoc"
        cargo run --package changelogger-cli -- prdoc validate "$PRDOC"

    - name: Validate Backport Rules
      if: startsWith(github.base_ref, 'stable') || startsWith(github.base_ref, 'release')
      run: |
        PRDOC="prdoc/pr_${{ github.event.pull_request.number }}.prdoc"
        cargo run --package changelogger-cli -- prdoc validate --branch "${{ github.base_ref }}" "$PRDOC"

    - name: Commit PRDoc
      if: steps.generate.outputs.generated == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Add prdoc for PR #${{ github.event.pull_request.number }} (auto-generated)"
        branch: ${{ github.head_ref }}
        file_pattern: "prdoc/*.prdoc"