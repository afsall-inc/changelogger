name: PRDoc
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-18
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --package changelogger-cli
      - name: Validate PRDoc
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PRDOC_PATH="prdoc/pr_${PR_NUM}.prdoc"
          if [ -f "$PRDOC_PATH" ]; then
            cargo run --package changelogger-cli -- prdoc validate "$PRDOC_PATH"
          else
            echo "No prdoc found at $PRDOC_PATH for PR #$PR_NUM"
            echo "PRs require a prdoc file. Create one with:"
            echo "  cargo run -- prdoc generate --pr $PR_NUM"
            exit 1
          fi