[workspace]
resolver = "2"
members = [
    "packages/prdoc",
    "packages/cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Afsall Inc."]
repository = "https://github.com/afsall-inc/changelogger"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
toml = "0.8"
cargo_metadata = "0.18"
tera = "1.20"
once_cell = "1.19"
clap = { version = "4.5", features = ["derive"] }